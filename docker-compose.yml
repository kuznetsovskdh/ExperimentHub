services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eh_pass}
      POSTGRES_DB: ${POSTGRES_DB:-experimenthub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eh_user} -d ${POSTGRES_DB:-experimenthub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure
    networks:
      - eh_network

  app:
    build: .
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eh_user}:${POSTGRES_PASSWORD:-eh_pass}@postgres:5432/${POSTGRES_DB:-experimenthub}
    depends_on:
      postgres:
        # Без этого приложение стартует раньше БД и падает на create_all().
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: on-failure
    volumes:
      - .:/app
    networks:
      - eh_network

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    depends_on:
      - app
    restart: on-failure
    networks:
      - eh_network

networks:
  # Внешняя сеть, общая с rustest и salesguard: клиентские продукты
  # обращаются к ExperimentHub по имени сервиса. Создать один раз:
  #   docker network create eh_network
  eh_network:
    external: true

volumes:
  pgdata:
