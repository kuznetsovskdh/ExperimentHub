server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Имя контейнера резолвится на лету: иначе nginx кэширует адрес при старте
    # и перестаёт видеть app после его пересоздания.
    resolver 127.0.0.11 valid=30s;

    # Весь API проксируется под /api, префикс срезается.
    # Остаток пути подставляется явно: при proxy_pass с переменной nginx не
    # делает автоматическую замену префикса location, и без $1 все запросы
    # уходили бы в корень сервиса.
    location ~* ^/api/(.*)$ {
        set $upstream http://app:8000/$1$is_args$args;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # Swagger UI, открытый на /api/docs, запрашивает схему по абсолютному
    # пути от корня. Без этих двух правил он получал бы index.html фронтенда
    # и падал с ошибкой разбора.
    location = /openapi.json {
        set $schema http://app:8000/openapi.json;
        proxy_pass $schema;
        proxy_set_header Host $host;
    }

    location ~* ^/(docs|redoc)$ {
        set $docs http://app:8000$uri$is_args$args;
        proxy_pass $docs;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой маршрут отдаёт index.html, роутинг разбирает react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
